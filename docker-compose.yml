services:

  # ─────────────────────────────────────────────
  # MongoDB
  # ─────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: policy-tracker-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: policy-tracker-db
    volumes:
      - mongodb_data:/data/db
    networks:
      - policy-tracker-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─────────────────────────────────────────────
  # Elasticsearch
  # ─────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.1
    container_name: policy_tracker_elasticsearch
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - "ES_JAVA_OPTS=-Xms1024m -Xmx1024m"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - policy-tracker-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────────
  # Backend — Spring Boot
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend/policy-tracker
      dockerfile: Dockerfile
    container_name: policy-tracker-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: 8080
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/policy-tracker-db
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: 9200
      ELASTICSEARCH_URIS: http://elasticsearch:9200
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mongodb:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - policy-tracker-net

  # ─────────────────────────────────────────────
  # Frontend — Quasar SPA / Nginx
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./policy-tracker-frontend
      dockerfile: Dockerfile
      args:
        QCLI_BASE_URL:  http://localhost:8080
        QCLI_WS_URL: ws://localhost:8080/ws
    container_name: policy-tracker-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend  # condition: service_healthy yerine doğrudan backend yazdık
    networks:
      - policy-tracker-net
# ─────────────────────────────────────────────
# Volumes
# ─────────────────────────────────────────────
volumes:
  mongodb_data:
    driver: local
  esdata:
    driver: local

# ─────────────────────────────────────────────
# Networks
# ─────────────────────────────────────────────
networks:
  policy-tracker-net:
    driver: bridge
